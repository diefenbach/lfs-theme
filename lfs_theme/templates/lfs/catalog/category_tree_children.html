{% load i18n lfs_tags %}
{% if categories %}
    <ul class="mobile-nav-items mobile-nav-sub-menu">
        <li class="mobile-nav-head">
            <button type="button" class="mobile-nav-back-link" aria-label="{% trans 'Back' %}"><i class="bi bi-chevron-left" aria-hidden="true"></i></button>
            <span class="mobile-nav-title">{{ category.name }}</span>
            <button type="button" class="mobile-nav-close" aria-label="{% trans 'Close menu' %}"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
        </li>
        <li class="mobile-nav-item">
            <a class="mobile-nav-link mobile-nav-all" href="{{ category.get_absolute_url }}"{% if is_current %} aria-current="page"{% endif %}>
                {% blocktrans with name=category.name %}All in {{ name }}{% endblocktrans %}
            </a>
        </li>
        {% for category in categories %}
            {% include "lfs/catalog/category_tree_item.html" %}
        {% endfor %}
    </ul>
{% endif %}
