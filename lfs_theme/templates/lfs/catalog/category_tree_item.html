{% load lfs_tags %}
{# One category of the mobile menu: a button that opens its children, or a link. is-current marks the path to the current category. #}
<li class="mobile-nav-item{% if category.children %} mobile-nav-expand{% endif %}{% if category.is_current %} is-current{% endif %}">
    {% if category.children %}
        <button type="button" class="mobile-nav-link mobile-nav-sub-menu-link">
            {{ category.category.name }}
        </button>
        {% category_tree_children category %}
    {% else %}
        <a class="mobile-nav-link" href="{{ category.category.get_absolute_url }}"{% if category.is_current %} aria-current="page"{% endif %}>
            {{ category.category.name }}
        </a>
    {% endif %}
</li>
