{% load i18n lfs_tags %}
<nav class="mobile-nav-sidebar" aria-label="{% trans 'Categories' %}">
    <ul class="mobile-nav-items">
        <li class="mobile-nav-item">
            <button type="button" class="mobile-nav-link mobile-nav-close-link">{% trans 'Close menu' %}</button>
        </li>
        {% for category in category_tree %}
            <li class="mobile-nav-item{% if category.children %} mobile-nav-expand{% endif %}{% if category.is_current %} active{% endif %}">
                {% if category.children %}
                    <button type="button" class="mobile-nav-link mobile-nav-sub-menu-link{% if category.is_current %} active{% endif %}">
                        {{ category.category.name }}
                    </button>
                    {% category_tree_children category %}
                {% else %}
                    <a class="mobile-nav-link{% if category.is_current %} active{% endif %}" href="{{ category.category.get_absolute_url }}">
                        {{ category.category.name }}
                    </a>
                {% endif %}
            </li>
        {% endfor %}
    </ul>
</nav>
