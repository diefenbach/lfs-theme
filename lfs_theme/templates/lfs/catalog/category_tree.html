{% load i18n lfs_tags %}
{# Mobile category menu: a drawer from the left, one level at a time (see initMobileMenu in main.js). #}
<div class="mobile-nav-backdrop"></div>
<nav class="mobile-nav-sidebar" id="mobile-nav" aria-label="{% trans 'Categories' %}" tabindex="-1">
    <ul class="mobile-nav-items">
        <li class="mobile-nav-head">
            <span class="mobile-nav-title">{% trans 'Categories' %}</span>
            <button type="button" class="mobile-nav-close" aria-label="{% trans 'Close menu' %}"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
        </li>
        {% for category in category_tree %}
            {% include "lfs/catalog/category_tree_item.html" %}
        {% endfor %}
    </ul>
</nav>
