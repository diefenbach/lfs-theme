{% load i18n %}

<h1 class="first-heading mt-4">
    {{ category.name }}
</h1>
<div class="description">
    {{ category.description|safe }}
</div>
<div id="categories" class="row cpd">
    {% for category_list in categories %}
        {% for category in category_list %}
            <div class="col-12 col-sm-6 {% if SlotRight and SlotLeft %}col-xxl-4{% elif SlotRight or SlotLeft %}col-xl-4{% else %}col-lg-4 col-xl-3{% endif %}">
                <div class="product row position-relative">
                    <div class="product-image col-12 col-sm-6 col-md-12 m-0 p-0">
                        {% if category.get_image %}
                            <img alt="{{ category.name }}"
                                src="{{ category.get_image.url_200x200 }}"/>
                        {% endif %}
                    </div>
                    <div class="product-info col-12 col-sm-6 col-md-12">
                        <h2 class="product-title"><a class="stretched-link" href="{% url 'lfs_category' category.slug %}">{{ category.name }}</a></h2>
                        <div class="product-description">
                            {{ category.short_description|truncatewords:8|safe }}
                        </div>
                    </div>
                </div>
            </div>
        {% endfor %}
    {% endfor %}
</div>
