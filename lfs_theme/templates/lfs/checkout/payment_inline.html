{% load i18n %}
<div class="payment">
    <div class="title">{% trans 'Payment' %}</div>
    {% for payment_method in payment_methods %}
        <div class="payment-method">
            <div class="form-check">
                <input type="radio"
                       name="payment_method"
                       class="update-checkout payment-methods payment-method-type-{{ payment_method.type }} form-check-input"
                       id="payment-method-{{ payment_method.id }}"
                       {% if payment_method.id == selected_payment_method.id %}checked="checked"{% endif %}
                       value="{{ payment_method.id }}"/>
                <label for="payment-method-{{ payment_method.id }}">{{ payment_method.name }}</label>
            </div>
            <div class="text-muted payment-method-note">
                {{ payment_method.description|safe }}
            </div>
        </div>
    {% endfor %}
</div>
