{% load i18n %}
<div class="shipping">
    <div class="title">{% trans 'Shipping' %}</div>
    {% for shipping_method in shipping_methods %}
        <div class="row shipping-method">
            <div class="col">
                <div class="form-check">
                    <input type="radio"
                        name="shipping-method"
                        class="update-checkout form-check-input"
                        {% if shipping_method.id == selected_shipping_method.id  %}checked="checked"{% endif %}
                        value="{{shipping_method.id}}"
                        id="shipping-method-{{shipping_method.id}}" />
                    <label class="form-check-label" for="shipping-method-{{shipping_method.id}}">{{ shipping_method.name }}</label>
                </div>
            </div>
            <div class="col-1"></div>
            <div class="col-11">
                {{ shipping_method.description|safe }}
            </div>
        </div>
    {% endfor %}
</div>
