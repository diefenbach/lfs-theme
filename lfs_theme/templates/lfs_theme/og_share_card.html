{% load lfs_seo_tags %}
{# The shop's image as og:image, for pages without an image of their own. #}
{% if SHOP.image %}
    {% with size=SHOP.image|image_size %}
        <meta property="og:image" content="{% absolute_uri request SHOP.image.url %}">
        {% if size %}
            <meta property="og:image:width" content="{{ size.0 }}">
            <meta property="og:image:height" content="{{ size.1 }}">
        {% endif %}
    {% endwith %}
{% endif %}
