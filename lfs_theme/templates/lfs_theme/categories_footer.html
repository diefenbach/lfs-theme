{% load i18n %}
{% if categories %}
    <div class="container">
        <h2 class="footer-title">{% trans 'Categories' %}</h2>
        <div class="row">
            {% for category in categories %}
                <div class="col-12 col-md-4 col-lg-3 col-xl-2 mb-3">
                    <a class="footer-main-category" href="{{ category.url }}">{{ category.name }}</a>
                    {% for child in category.children %}
                        <a class="footer-sub-category" href="{{ child.url }}">{{ child.name }}</a>
                    {% endfor %}
                </div>
            {% endfor %}
        </div>
    </div>
{% endif %}
