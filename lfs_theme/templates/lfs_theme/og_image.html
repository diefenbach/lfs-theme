{% load lfs_seo_tags %}
{# og:image from ``image`` (a model's image field) with its real size, or the share card without one. #}
{% with size=image|image_size %}
{% if size %}
<meta property="og:image" content="{% absolute_uri request image.url %}">
<meta property="og:image:width" content="{{ size.0 }}">
<meta property="og:image:height" content="{{ size.1 }}">
{% else %}
{% include "lfs_theme/og_share_card.html" %}
{% endif %}
{% endwith %}
